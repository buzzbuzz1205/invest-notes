<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>투자 영상 요약 노트</title>
<!-- 공유 사이트 입구. share.py 가 내용 전체를 암호화해 아래 payload 에 넣는다. 비밀번호가 맞아야 브라우저에서 풀린다. -->
<style>
:root {
  --bg: #f3f5f7; --surface: #ffffff; --ink: #15202b; --muted: #5a6572; --line: #d9dfe5;
  --accent: #17656e; --warn: #a23b2c;
  --font-body: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161b; --surface: #182028; --ink: #e4e9ee; --muted: #9aa6b2; --line: #2a343e;
    --accent: #5cc0c9; --warn: #ec8b7a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161b; --surface: #182028; --ink: #e4e9ee; --muted: #9aa6b2; --line: #2a343e;
  --accent: #5cc0c9; --warn: #ec8b7a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
  background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font-body); }
form { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; padding: 24px 20px; display: grid; gap: 12px; }
h1 { margin: 0; font-size: 20px; }
p { margin: 0; color: var(--muted); font-size: 13.5px; }
input[type=password] { font: inherit; width: 100%; padding: 10px 12px; border: 1px solid var(--line);
  border-radius: 8px; background: var(--bg); color: var(--ink); }
label { display: flex; gap: 8px; align-items: center; font-size: 13.5px; color: var(--muted); }
button { font: inherit; font-weight: 600; padding: 10px; border: 0; border-radius: 8px;
  background: var(--accent); color: var(--surface); cursor: pointer; }
button:disabled { opacity: .6; cursor: default; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.err { color: var(--warn); font-size: 13.5px; }
</style>
</head>
<body>
<form id="gate" hidden>
  <h1>투자 영상 요약 노트</h1>
  <p>공유받은 비밀번호를 입력하세요.</p>
  <input id="pw" type="password" autocomplete="current-password" aria-label="비밀번호" required>
  <label><input id="remember" type="checkbox" checked> 이 기기에서 기억하기</label>
  <button id="go" type="submit">열기</button>
  <p class="err" id="err" role="alert" hidden></p>
</form>

  var STORE = 'yt-share-key';
  var form = document.getElementById('gate');
  var err = document.getElementById('err');
  var go = document.getElementById('go');

  function bytes(s) {
    var b = atob(s), u = new Uint8Array(b.length);
    for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
    return u;
  }
  function str(u) {
    var s = '';
    for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]);
    return btoa(s);
  }
  function show(msg) {
    form.hidden = false;
    err.textContent = msg || '';
    err.hidden = !msg;
    go.disabled = false;
    go.textContent = '열기';
  }

  async function derive(pw) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw.normalize('NFC')), 'PBKDF2', false, ['deriveBits']);
    var bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: bytes(P.s), iterations: P.n, hash: 'SHA-256' }, base, 256);
    return new Uint8Array(bits);
  }
  async function decrypt(raw) {
    var key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    var gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.i) }, key, bytes(P.c));
    return new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  }
  function render(html) {
    document.open();
    document.write(html);
    document.close();
  }

  if (!P) { show('아직 공유된 내용이 없습니다.'); go.disabled = true; return; }
  if (!window.crypto || !crypto.subtle || typeof DecompressionStream === 'undefined') {
    show('이 브라우저에서는 열 수 없습니다. 최신 Chrome·Safari·Edge 등으로 열어 주세요.');
    go.disabled = true;
    return;
  }

  form.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    go.disabled = true;
    go.textContent = '확인 중…';
    err.hidden = true;
    var raw, html;
    try {
      raw = await derive(document.getElementById('pw').value);
      html = await decrypt(raw);
    } catch (e) {
      show('비밀번호가 맞지 않습니다.');
      return;
    }
    try {
      if (document.getElementById('remember').checked) localStorage.setItem(STORE, JSON.stringify({ s: P.s, k: str(raw) }));
      else localStorage.removeItem(STORE);
    } catch (e) {}
    render(html);
  });

  // 기억해 둔 키가 지금 비밀번호(salt)와 맞으면 바로 연다. 비밀번호가 바뀌면 salt가 달라져 다시 묻는다.
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) {}
  if (saved && saved.s === P.s) {
    decrypt(bytes(saved.k)).then(render, function () {
      try { localStorage.removeItem(STORE); } catch (e) {}
      show();
    });
  } else {
    show();
  }
})();
