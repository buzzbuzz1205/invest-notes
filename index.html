<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>투자 영상 요약 노트</title>
<!-- 공유 사이트 입구. share.py 가 내용 전체를 암호화해 아래 payload 에 넣는다. 비밀번호가 맞아야 브라우저에서 풀린다. -->
<style>
:root {
  --bg: #f3f5f7; --surface: #ffffff; --ink: #15202b; --muted: #5a6572; --line: #d9dfe5;
  --accent: #17656e; --warn: #a23b2c;
  --font-body: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161b; --surface: #182028; --ink: #e4e9ee; --muted: #9aa6b2; --line: #2a343e;
    --accent: #5cc0c9; --warn: #ec8b7a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161b; --surface: #182028; --ink: #e4e9ee; --muted: #9aa6b2; --line: #2a343e;
  --accent: #5cc0c9; --warn: #ec8b7a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
  background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font-body); }
form { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; padding: 24px 20px; display: grid; gap: 12px; }
h1 { margin: 0; font-size: 20px; }
p { margin: 0; color: var(--muted); font-size: 13.5px; }
input[type=password] { font: inherit; width: 100%; padding: 10px 12px; border: 1px solid var(--line);
  border-radius: 8px; background: var(--bg); color: var(--ink); }
label { display: flex; gap: 8px; align-items: center; font-size: 13.5px; color: var(--muted); }
button { font: inherit; font-weight: 600; padding: 10px; border: 0; border-radius: 8px;
  background: var(--accent); color: var(--surface); cursor: pointer; }
button:disabled { opacity: .6; cursor: default; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.err { color: var(--warn); font-size: 13.5px; }
</style>
</head>
<body>
<form id="gate" hidden>
  <h1>투자 영상 요약 노트</h1>
  <p>공유받은 비밀번호를 입력하세요.</p>
  <input id="pw" type="password" autocomplete="current-password" aria-label="비밀번호" required>
  <label><input id="remember" type="checkbox" checked> 이 기기에서 기억하기</label>
  <button id="go" type="submit">열기</button>
  <p class="err" id="err" role="alert" hidden></p>
</form>

      show();
    });
  } else {
    show();
  }
})();
</script>
